<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>登入中...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "微軟正黑體", sans-serif;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .message-box {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease forwards;
    }

    .spinner {
      border: 6px solid #e5e7eb;
      border-top: 6px solid #2563eb;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .title {
      font-size: 20px;
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }

    .prank-text {
      display: none;
      font-size: 24px;
      color: red;
      font-weight: bold;
      margin-bottom: 16px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="message-box">
  <div class="prank-text" id="prankText">你被騙了 哈</div>
  <div class="spinner"></div>
  <div class="title">目前登入人數過多</div>
  <div class="description">
    系統正忙碌中，請您稍後再試。<br>
    感謝您的耐心與體諒。
  </div>
</div>

<script>
  // 30秒後顯示騙人字樣
  setTimeout(() => {
    document.getElementById("prankText").style.display = "block";
  }, 30000);
</script>

</body>
</html>
